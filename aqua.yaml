---
# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
#
# Pin infra CLI versions here. The devcontainer and CI use the same versions.
# The actual binaries are downloaded on first run (aqua i -l has only created the links).
# After bumping a version, update aqua-checksums.json with aqua upc -prune
checksum:
  enabled: true
  require_checksum: true
registries:
  - type: standard
    ref: v4.566.0 # renovate: depName=aquaproj/aqua-registry
packages:
  - name: hashicorp/terraform@v1.16.4
  - name: terraform-linters/tflint@v0.64.0
  - name: kayac/ecspresso@v2.8.6
  - name: aws/aws-cli@2.37.1
  - name: gitleaks/gitleaks@v8.30.1
  - name: rhysd/actionlint@v1.7.12
  - name: koalaman/shellcheck@v0.11.0
