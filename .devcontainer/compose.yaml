# short-link-service devcontainer
#
# A single dev service. Enter the container and develop with sbt.
# Docker is not in the image; the docker-outside-of-docker feature in devcontainer.json
# adds a CLI that uses the host's /var/run/docker.sock.
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      CLAUDE_CONFIG_DIR: /home/dev/.claude
    volumes:
      - ..:/app

      # ---- sbt caches (survive container rebuilds) ----
      - sbt-cache:/home/dev/.sbt
      - ivy2-cache:/home/dev/.ivy2
      - coursier-cache:/home/dev/.cache/coursier

      # ---- git / SSH ----
      - ${HOME}/.ssh:/home/dev/.ssh:ro
      - ${HOME}/.gitconfig:/home/dev/.gitconfig:ro

      # ---- gh credentials (shared with the host; no re-login after container rebuild) ----
      # This is a directory bind mount, so the inode problem seen with ~/.claude.json does not occur.
      # The host-side directory is created as user-owned by initializeCommand in devcontainer.json
      - ${HOME}/.config/gh:/home/dev/.config/gh

      # ---- AWS credentials (SSO profile and token cache) ----
      # aws sso login writes the cache, so mount read-write.
      # The host-side directory is created by initializeCommand in devcontainer.json
      - ${HOME}/.aws:/home/dev/.aws

      # ---- CLIs downloaded by aqua (terraform etc.) ----
      - aqua-cache:/home/dev/.local/share/aquaproj-aqua

      # ---- Claude Code auth and settings ----
      # Bind-mounting ~/.claude.json as a single file breaks: every time Claude Code updates it by
      # "write a temp file and rename", the inode changes (it asks you to log in every time).
      # Do not share it with the host; persist the whole directory in a named volume instead.
      # With CLAUDE_CONFIG_DIR pointed here, .claude.json is also stored inside it
      - claude-config:/home/dev/.claude

      # ---- Antigravity CLI (agy) auth and settings ----
      # Like Claude Code, keep it in a named volume so rebuilding the container does not require logging in again
      - gemini-config:/home/dev/.gemini

volumes:
  sbt-cache:
  ivy2-cache:
  coursier-cache:
  claude-config:
  aqua-cache:
  gemini-config:
