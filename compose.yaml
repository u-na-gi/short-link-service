# For development. Start with make up. You are not expected to work inside the containers; source edited on the host
# (or in the devcontainer) is mounted and picked up by sbt run and Vite hot reload.
#
# The devcontainer uses the host's Docker (docker-outside-of-docker), so bind mount sources are
# interpreted on the host. remoteEnv in devcontainer.json sets LOCAL_WORKSPACE_FOLDER to the host
# path. When run directly from the host it is unset, so the current directory is used.
name: short-link-service

services:
  server:
    build: ./src/server
    env_file: .env
    environment:
      # Vite's proxy rewrites Host to the proxy target (server:9000).
      # That is not in Play's default allowed list (localhost etc.), so add it
      PLAY_EXTRA_ALLOWED_HOST: server
      # sbt's progress display and colors end up in the logs as control characters and make JSON logs unreadable, so turn them off
      SBT_OPTS: -Dsbt.supershell=false -Dsbt.color=false
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/src/server:/app
      # Keep build outputs container-only so they do not conflict with the devcontainer's sbt / Metals
      - server-target:/app/target
      - server-project-target:/app/project/target
      # Cache so dependencies are not fetched again every time
      - sbt-cache:/home/dev/.sbt
      - coursier-cache:/home/dev/.cache/coursier
    ports:
      - "9000:9000"
    # sbt run treats a closed stdin as Enter being pressed and stops
    stdin_open: true
    tty: true

  front:
    build: ./src/front
    environment:
      # Where Vite's proxy forwards /api and /{code}
      API_ORIGIN: http://server:9000
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/src/front:/app
      # Use the node_modules installed in the image. make up's --renew-anon-volumes recreates it every time
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  server-target:
  server-project-target:
  sbt-cache:
  coursier-cache:
