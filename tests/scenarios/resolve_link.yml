desc: Resolve a short URL back to the original URL (302 redirect and resolve API)
labels:
  - links
# Not run in environments behind Turnstile (staging / prod) since no token can be obtained. turnstile.yml checks the 403
if: env.E2E_TURNSTILE != 'on'
runners:
  req:
    endpoint: ${E2E_BASE_URL:-http://localhost:9000}
    # We want to check the 302 itself and its Location, so do not follow redirects
    notFollowRedirect: true
vars:
  # Service token that passes Cloudflare Access (develop / staging). make e2e-remote passes it from SSM.
  # Locally (make e2e) it is sent empty and Vite / Play ignore it. Used in the headers of every step
  access: &access
    CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID:-}"
    CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET:-}"
  originalUrl: https://www.example.org/
  # A well-formed but unissued short URL. The host matches the server's shortener.base-url (same idea as E2E_SELF_URL)
  unknownShortUrl: ${E2E_UNKNOWN_SHORT_URL:-https://example.com/zzzzzzzz}
steps:
  create:
    desc: Create a short link
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "{{ vars.originalUrl }}"
    test: current.res.status == 201
    bind:
      code: current.res.body.code
  resolve:
    desc: GET /{code} returns 302 with the original URL in Location
    req:
      /{{ code }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 302
      && current.res.headers['Location'][0] == vars.originalUrl
  unknown:
    desc: Unknown code is 404 not_found
    req:
      /zzzzzzzz:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 404
      && current.res.body.error == 'not_found'
  resolveApi:
    desc: GET /api/v1/links/resolve with the shortUrl from creation returns 200 and the original URL
    req:
      /api/v1/links/resolve?shortUrl={{ urlencode(steps.create.res.body.shortUrl) }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 200
      && current.res.body.code == code
      && current.res.body.shortUrl == steps.create.res.body.shortUrl
      && current.res.body.originalUrl == vars.originalUrl
  resolveApiUnknown:
    desc: Well-formed but unissued short URL is 404 not_found
    req:
      /api/v1/links/resolve?shortUrl={{ urlencode(vars.unknownShortUrl) }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 404
      && current.res.body.error == 'not_found'
  resolveApiNotShortUrl:
    desc: 400 not_short_url when it is not this service's short URL
    req:
      /api/v1/links/resolve?shortUrl={{ urlencode('https://other.example/abcd1234') }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 400
      && current.res.body.error == 'not_short_url'
  resolveApiMissing:
    desc: 400 invalid_request when shortUrl is missing
    req:
      /api/v1/links/resolve:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_request'
