desc: 短縮URLから元URLへ戻す (302 リダイレクトと復元 API)
labels:
  - links
# Turnstile をかけた環境 (staging / prod) ではトークンを取れないので流さない。turnstile.yml が 403 を確かめる
if: env.E2E_TURNSTILE != 'on'
runners:
  req:
    endpoint: ${E2E_BASE_URL:-http://localhost:9000}
    # 302 そのものとその Location を検証したいので、リダイレクトは追わない
    notFollowRedirect: true
vars:
  # Cloudflare Access (develop / staging) を通るサービストークン。make e2e-remote が SSM から渡す。
  # ローカル (make e2e) では空で送り、Vite / Play は無視する。全ステップの headers で使う
  access: &access
    CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID:-}"
    CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET:-}"
  originalUrl: https://www.example.org/
  # 形は正しいが未発行の短縮URL。ホストは server の shortener.base-url と揃える (E2E_SELF_URL と同じ考え方)
  unknownShortUrl: ${E2E_UNKNOWN_SHORT_URL:-https://example.com/zzzzzzzz}
steps:
  create:
    desc: 短縮リンクを作る
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "{{ vars.originalUrl }}"
    test: current.res.status == 201
    bind:
      code: current.res.body.code
  resolve:
    desc: GET /{code} が 302 で元URLを Location に返す
    req:
      /{{ code }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 302
      && current.res.headers['Location'][0] == vars.originalUrl
  unknown:
    desc: 未知のコードは 404 not_found
    req:
      /zzzzzzzz:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 404
      && current.res.body.error == 'not_found'
  resolveApi:
    desc: GET /api/v1/links/resolve に作成時の shortUrl を渡すと 200 で元URLを返す
    req:
      /api/v1/links/resolve?shortUrl={{ urlencode(steps.create.res.body.shortUrl) }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 200
      && current.res.body.code == code
      && current.res.body.shortUrl == steps.create.res.body.shortUrl
      && current.res.body.originalUrl == vars.originalUrl
  resolveApiUnknown:
    desc: 形は正しいが未発行の短縮URLは 404 not_found
    req:
      /api/v1/links/resolve?shortUrl={{ urlencode(vars.unknownShortUrl) }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 404
      && current.res.body.error == 'not_found'
  resolveApiNotShortUrl:
    desc: 自サービスの短縮URLでなければ 400 not_short_url
    req:
      /api/v1/links/resolve?shortUrl={{ urlencode('https://other.example/abcd1234') }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 400
      && current.res.body.error == 'not_short_url'
  resolveApiMissing:
    desc: shortUrl が無ければ 400 invalid_request
    req:
      /api/v1/links/resolve:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_request'
