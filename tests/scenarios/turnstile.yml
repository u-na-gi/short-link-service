desc: In environments behind Turnstile, shorten and resolve without a token are rejected with 403
labels:
  - turnstile
# Only for environments behind Turnstile (staging / prod). make e2e-remote passes E2E_TURNSTILE=on
if: env.E2E_TURNSTILE == 'on'
runners:
  req:
    endpoint: ${E2E_BASE_URL:-http://localhost:9000}
    notFollowRedirect: true
vars:
  # Service token that passes Cloudflare Access (develop / staging). make e2e-remote passes it from SSM.
  # Locally (make e2e) it is sent empty and Vite / Play ignore it. Used in the headers of every step
  access: &access
    CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID:-}"
    CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET:-}"
steps:
  shortenWithoutToken:
    desc: Shorten without a token is 403 turnstile_failed
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: https://www.example.org/
    test: |
      current.res.status == 403
      && current.res.body.error == 'turnstile_failed'
  shortenWithBogusToken:
    desc: Shorten with a fake token is 403 turnstile_failed
    req:
      /api/v1/links:
        post:
          headers:
            <<: *access
            X-Turnstile-Token: bogus
          body:
            application/json:
              url: https://www.example.org/
    test: |
      current.res.status == 403
      && current.res.body.error == 'turnstile_failed'
  resolveWithoutToken:
    desc: Resolve without a token is 403 turnstile_failed
    req:
      /api/v1/links/resolve?shortUrl={{ urlencode(env.E2E_BASE_URL + '/abcd1234') }}:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 403
      && current.res.body.error == 'turnstile_failed'
  redirectIsNotProtected:
    desc: Short URL redirects are not behind Turnstile (404 not_found if unregistered)
    req:
      /zzzzzzzz:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 404
      && current.res.body.error == 'not_found'
