desc: Reject URLs that cannot be shortened with 400
labels:
  - links
  - validation
# Not run in environments behind Turnstile (staging / prod) since no token can be obtained. turnstile.yml checks the 403
if: env.E2E_TURNSTILE != 'on'
runners:
  req: ${E2E_BASE_URL:-http://localhost:9000}
vars:
  # Service token that passes Cloudflare Access (develop / staging). make e2e-remote passes it from SSM.
  # Locally (make e2e) it is sent empty and Vite / Play ignore it. Used in the headers of every step
  access: &access
    CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID:-}"
    CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET:-}"
  # Whether a URL points to this service is checked against the host of the server's shortener.base-url.
  # When changing the target, update this together with E2E_BASE_URL
  selfUrl: ${E2E_SELF_URL:-http://localhost:9000/abcd1234}
steps:
  missingField:
    desc: invalid_request when the url field is missing
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json: {}
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_request'
  notAString:
    desc: invalid_request when url is not a string
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: 123
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_request'
  emptyString:
    desc: Empty string is invalid_url
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: ""
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_url'
  selfReference:
    desc: URL pointing to this service is self_reference
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "{{ vars.selfUrl }}"
    test: |
      current.res.status == 400
      && current.res.body.error == 'self_reference'
  withCredentials:
    desc: URL with credentials is invalid_url
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "https://user:pass@evil.example.com/"
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_url'
  unsupportedScheme:
    desc: Schemes other than http/https are invalid_url
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "ftp://example.com"
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_url'
