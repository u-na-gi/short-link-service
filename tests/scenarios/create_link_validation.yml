desc: 短縮できない URL を 400 で弾く
labels:
  - links
  - validation
# Turnstile をかけた環境 (staging / prod) ではトークンを取れないので流さない。turnstile.yml が 403 を確かめる
if: env.E2E_TURNSTILE != 'on'
runners:
  req: ${E2E_BASE_URL:-http://localhost:9000}
vars:
  # Cloudflare Access (develop / staging) を通るサービストークン。make e2e-remote が SSM から渡す。
  # ローカル (make e2e) では空で送り、Vite / Play は無視する。全ステップの headers で使う
  access: &access
    CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID:-}"
    CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET:-}"
  # 自サービス宛の判定はサーバ側の shortener.base-url のホストと突き合わせる。
  # 向き先を変えるときは E2E_BASE_URL と一緒にこちらも揃える
  selfUrl: ${E2E_SELF_URL:-http://localhost:9000/abcd1234}
steps:
  missingField:
    desc: url フィールドが無ければ invalid_request
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json: {}
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_request'
  notAString:
    desc: url が文字列でなければ invalid_request
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: 123
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_request'
  emptyString:
    desc: 空文字は invalid_url
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: ""
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_url'
  selfReference:
    desc: 自サービス宛は self_reference
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "{{ vars.selfUrl }}"
    test: |
      current.res.status == 400
      && current.res.body.error == 'self_reference'
  withCredentials:
    desc: 認証情報つきは invalid_url
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "https://user:pass@evil.example.com/"
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_url'
  unsupportedScheme:
    desc: http/https 以外は invalid_url
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "ftp://example.com"
    test: |
      current.res.status == 400
      && current.res.body.error == 'invalid_url'
