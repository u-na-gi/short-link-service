desc: Can shorten a URL
labels:
  - links
# Not run in environments behind Turnstile (staging / prod) since no token can be obtained. turnstile.yml checks the 403
if: env.E2E_TURNSTILE != 'on'
runners:
  req: ${E2E_BASE_URL:-http://localhost:9000}
vars:
  # Service token that passes Cloudflare Access (develop / staging). make e2e-remote passes it from SSM.
  # Locally (make e2e) it is sent empty and Vite / Play ignore it. Used in the headers of every step
  access: &access
    CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID:-}"
    CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET:-}"
  originalUrl: https://www.example.org/
steps:
  create:
    desc: POST /api/v1/links returns 201 and a short link
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "{{ vars.originalUrl }}"
    test: |
      current.res.status == 201
      && current.res.headers['Content-Type'][0] startsWith 'application/json'
      && current.res.body.originalUrl == vars.originalUrl
      && len(current.res.body.code) == 8
      && current.res.body.code matches '^[A-Za-z0-9]{8}$'
      && current.res.body.shortUrl endsWith ('/' + current.res.body.code)
  createAgain:
    desc: POSTing the same URL again returns the same code
    req:
      /api/v1/links:
        post:
          headers: *access
          body:
            application/json:
              url: "{{ vars.originalUrl }}"
    test: |
      current.res.status == 201
      && current.res.body.code == steps.create.res.body.code
