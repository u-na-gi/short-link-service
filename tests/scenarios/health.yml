desc: サーバが起動していて JSON を返す
labels:
  - smoke
runners:
  req: ${E2E_BASE_URL:-http://localhost:9000}
vars:
  # Cloudflare Access (develop / staging) を通るサービストークン。make e2e-remote が SSM から渡す。
  # ローカル (make e2e) では空で送り、Vite / Play は無視する。全ステップの headers で使う
  access: &access
    CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID:-}"
    CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET:-}"
steps:
  health:
    # フロント経由だと GET / は index.html になるので、/api 側のヘルスチェックを見る
    desc: GET /api/v1/health が ok を返す
    req:
      /api/v1/health:
        get:
          headers:
            <<: *access
            Accept: application/json
    test: |
      current.res.status == 200
      && current.res.body.status == 'ok'
