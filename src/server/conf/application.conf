# https://www.playframework.com/documentation/latest/Configuration

# Public URL of this service shown to users (scheme + host [+ port], no path).
# Short URLs are this plus /{code}. URLs pointing at this host are rejected as self-references (redirect loops).
# Locally the front end's Vite (5173) forwards /api and /{code} to Play, so the Vite side is the public URL.
# Deployed environments pass it via SHORTENER_BASE_URL (Terraform output shortener_base_url goes into the ECS task definition).
# staging / prod use the site's public URL; develop uses https://example.com as the requirements say.
shortener.base-url = "http://localhost:5173"
shortener.base-url = ${?SHORTENER_BASE_URL}

# Maximum number of short links stored. Storage is in memory, so this keeps the public write API from using up memory.
# URLs are up to 2048 characters, so one entry can be a few KB. 100,000 entries stay within a few hundred MB at worst.
# When raising it, also check the task memory (infra/ecspresso/ecs-task-def.json).
shortener.max-links = 100000
shortener.max-links = ${?SHORTENER_MAX_LINKS}

# Secret key for signing and encryption. In prod mode, the app does not start with the default "changeme" or a short value.
# In production, ECS injects it into PLAY_HTTP_SECRET_KEY from SSM. It can be unset in dev mode.
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

# Allow adding one entry to the Host header allow list (default: localhost / .local / 127.0.0.1) via an env var.
# Needed because in compose the Vite proxy rewrites Host to the proxy target (server:9000).
# Adds nothing if unset.
play.filters.hosts.allowed += ${?PLAY_EXTRA_ALLOWED_HOST}

# Return Play's own errors in the same JSON shape as the API, and log exceptions with stack traces
play.http.errorHandler = "controllers.ErrorHandler"

# Put the request ID and access log filters outermost, so requests rejected by the Host or CSRF filters are also logged.
# The access log reads the ID, so RequestIdFilter comes first (outer)
play.filters.enabled = ["logging.RequestIdFilter", "logging.AccessLogFilter"] ${play.filters.enabled}
