# https://www.playframework.com/documentation/latest/Configuration

# 利用者に見せる自サービスの公開 URL（スキーム + ホスト [+ ポート]、パスなし）。
# 短縮 URL はこれに /{code} を付けて返す。このホスト宛の URL は自己参照（リダイレクトループ）として拒否する。
# ローカルではフロントの Vite (5173) が /api と /{code} を Play に流すので、Vite 側を公開 URL にする。
# 本番は SHORTENER_BASE_URL で CloudFront のドメイン (https://example.com) を渡す。
shortener.base-url = "http://localhost:5173"
shortener.base-url = ${?SHORTENER_BASE_URL}

# Host ヘッダの許可リスト (既定は localhost / .local / 127.0.0.1) に、環境変数で 1 つ足せるようにする。
# compose では Vite のプロキシが Host をプロキシ先 (server:9000) に書き換えて流してくるため。
# 未設定なら何も足さない。
play.filters.hosts.allowed += ${?PLAY_EXTRA_ALLOWED_HOST}

# Play 自身のエラーも API と同じ JSON の形で返し、例外はスタックトレース付きでログに出す
play.http.errorHandler = "controllers.ErrorHandler"

# リクエスト ID とアクセスログは一番外側に置く。Host や CSRF のフィルタで弾かれたリクエストも記録するため。
# アクセスログが ID を読むので、RequestIdFilter が先 (外側)
play.filters.enabled = ["logging.RequestIdFilter", "logging.AccessLogFilter"] ${play.filters.enabled}
