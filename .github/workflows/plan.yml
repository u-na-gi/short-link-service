# Run terraform plan on PRs. Uses a read-only role (plan) and a mostly-Read Cloudflare token.
# PRs from forks do not get secrets, so run only for PRs from branches in this repository.
# Plan output goes only to the logs (public repository, so no PR comment. Account IDs are masked).
# infra/terraform/github needs GitHub admin permissions, so CI does not handle it (apply it locally).
name: plan

on:
  pull_request:
    branches: [develop, main]
    # Skip PRs that only change Markdown and the devcontainer (no infra diff)
    paths-ignore:
      - "**.md"
      - ".devcontainer/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: plan (${{ matrix.stack }})
    runs-on: ubuntu-latest
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        stack: [shared, envs/develop, envs/staging, envs/prod]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_access_allowed_email: ${{ secrets.TF_VAR_access_allowed_email }}
      AQUA_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-duration-seconds: 7200
          mask-aws-account-id: true
      - run: terraform -chdir="infra/terraform/$STACK" init -input=false
        env:
          STACK: ${{ matrix.stack }}
      - run: terraform -chdir="infra/terraform/$STACK" plan -input=false -lock-timeout=5m
        env:
          STACK: ${{ matrix.stack }}
