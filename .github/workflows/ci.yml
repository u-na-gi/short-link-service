# PR と、deploy の前 (deploy.yml から呼ぶ) に流すチェック。AWS や Cloudflare には触らない (シークレットを使わない)。
name: ci

on:
  pull_request:
    # Markdown だけの PR では流さない (検査する対象が変わらない)
    paths-ignore:
      - "**.md"
  workflow_call:

permissions:
  contents: read

env:
  # aqua が GitHub からツールを落とすときのレート制限を避ける
  AQUA_GITHUB_TOKEN: ${{ github.token }}

jobs:
  secrets-scan:
    name: 秘密情報の検出 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      # 全履歴を見る。見つかったら値は伏せて場所だけ出す
      - run: gitleaks git --redact --no-banner .

  workflows:
    name: ワークフローの検査 (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      - run: actionlint

  server:
    name: server (sbt test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@ce95da69b39609ea153bad087708da5f37366897 # v1.5.10
      - run: sbt -batch scalafmtCheckAll test

  front:
    name: front (型・テスト・ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bunx tsc --noEmit -p worker
      - run: bun test
      - run: bun run build

  tests-lint:
    name: E2E シナリオの整形
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # oxlint (bun run lint) は、lint する TypeScript が tests/ に無いので流さない (ファイルが無いと失敗する)
      - run: bun run format:check

  terraform:
    name: terraform (fmt / validate / tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      - run: terraform fmt -check -recursive infra/terraform
      # backend に繋がずに (認証なしで) 構文と型だけ確かめる
      - name: validate と tflint
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/shared infra/terraform/github infra/terraform/envs/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            tflint --chdir="$dir" --call-module-type=all
            echo "::endgroup::"
          done

  e2e:
    name: E2E (ローカルの compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 開発用のコンテナは uid 1000 で動き、マウントしたソースに書く (sbt の .bsp など)。
      # ランナーのチェックアウトは別の uid の持ち物なので、書けるようにしておく
      - run: chmod -R a+w src tests
      - run: make e2e
