# Checks run on PRs and before deploy (called from deploy.yml). Does not touch AWS or Cloudflare (uses no secrets).
name: ci

on:
  pull_request:
    # Skip PRs that only change Markdown and the devcontainer (nothing to check changes)
    paths-ignore:
      - "**.md"
      - ".devcontainer/**"
  workflow_call:

permissions:
  contents: read

env:
  # Avoid rate limits when aqua downloads tools from GitHub
  AQUA_GITHUB_TOKEN: ${{ github.token }}

jobs:
  secrets-scan:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      # Scan the full history. On a hit, show only the location and hide the value
      - run: gitleaks git --redact --no-banner .

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      - run: actionlint

  server:
    name: server (sbt test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@ce95da69b39609ea153bad087708da5f37366897 # v1.5.10
      - run: sbt -batch scalafmtCheckAll test

  front:
    name: front (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bunx tsc --noEmit -p worker
      - run: bun test
      - run: bun run build

  tests-lint:
    name: E2E scenario formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Skip oxlint (bun run lint): tests/ has no TypeScript to lint (it fails when there are no files)
      - run: bun run format:check

  terraform:
    name: terraform (fmt / validate / tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      - run: terraform fmt -check -recursive infra/terraform
      # Check only syntax and types, without connecting to the backend (no credentials)
      - name: validate and tflint
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/shared infra/terraform/github infra/terraform/envs/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            tflint --chdir="$dir" --call-module-type=all
            echo "::endgroup::"
          done

  e2e:
    name: E2E (local compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The dev container runs as uid 1000 and writes into the mounted source (sbt's .bsp etc.).
      # The runner's checkout belongs to a different uid, so make it writable
      - run: chmod -R a+w src tests
      - run: make e2e
