# Push to develop -> develop, push to main -> staging, v* tag -> prod.
# The GitHub Environment decides the target, and the Environment restricts branches/tags and approval (prod)
# (infra/terraform/github). The AWS role can also only be assumed from that Environment (infra/terraform/shared/ci.tf).
#
# Flow: CI (ci.yml) -> image (tagged with the commit sha) -> terraform apply -> ecspresso deploy -> Worker
# (E2E against deployed environments runs locally with make e2e-remote. See the comment on the last step for why)
# prod ships only commits that are in main, using the same-sha image built on main (no rebuild).
name: deploy

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
    # Skip CI and deploy for pushes that only change Markdown and the devcontainer (nothing to ship changes).
    # Path filters do not apply to tag pushes, so v* always runs
    paths-ignore:
      - "**.md"
      - ".devcontainer/**"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  target:
    name: Decide target
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.env }}
    steps:
      - id: env
        run: |
          case "$GITHUB_REF" in
            refs/heads/develop) echo "env=develop" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main)    echo "env=staging" >> "$GITHUB_OUTPUT" ;;
            refs/tags/v*)       echo "env=prod"    >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected ref: $GITHUB_REF"; exit 1 ;;
          esac

  deploy:
    name: deploy (${{ needs.target.outputs.env }})
    needs: [ci, target]
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.env }}
    permissions:
      contents: read
      id-token: write
    # One deploy at a time per environment. Do not cancel: stopping midway leaves state and tasks half-done
    concurrency:
      group: deploy-${{ needs.target.outputs.env }}
      cancel-in-progress: false
    env:
      ENV: ${{ needs.target.outputs.env }}
      IMAGE_TAG: ${{ github.sha }}
      AQUA_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # prod needs history to check "is this commit in main"
          fetch-depth: 0
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: src/front

      - name: prod only for commits in main
        if: env.ENV == 'prod'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not in main. Only tag commits that have gone through staging"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-duration-seconds: 7200
          mask-aws-account-id: true

      - name: Image (build and push if missing; prod does not build)
        run: |
          terraform -chdir=infra/terraform/shared init -input=false >/dev/null
          repo=$(terraform -chdir=infra/terraform/shared output -raw server_repository_url)
          exists() {
            aws ecr describe-images --repository-name short-link-service/server --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>"$RUNNER_TEMP/ecr.err" && return 0
            # Stop on errors other than "not found" (permissions, throttling) instead of mistaking them for "missing"
            grep -q ImageNotFoundException "$RUNNER_TEMP/ecr.err" || { cat "$RUNNER_TEMP/ecr.err"; exit 1; }
            return 1
          }
          if exists; then
            echo "image $IMAGE_TAG already exists"
            exit 0
          fi
          if [ "$ENV" = prod ]; then
            echo "::error::prod uses the image built on main. No image for $IMAGE_TAG (tag after the deploy for the push to main finishes)"
            exit 1
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
          # Build a single manifest (with an index, the actual image is untagged and gets removed by the ECR lifecycle. See Dockerfile.prod)
          docker build --provenance=false --sbom=false -f src/server/Dockerfile.prod -t "$repo:$IMAGE_TAG" src/server
          # Pushing the same commit to develop and main at once conflicts with whichever was pushed first (tags cannot be overwritten)
          if ! docker push "$repo:$IMAGE_TAG"; then
            exists || exit 1
            echo "image $IMAGE_TAG was pushed by another run"
          fi

      - name: terraform apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_access_allowed_email: ${{ secrets.TF_VAR_access_allowed_email }}
        run: |
          terraform -chdir="infra/terraform/envs/$ENV" init -input=false
          terraform -chdir="infra/terraform/envs/$ENV" apply -input=false -auto-approve -lock-timeout=5m

      - name: ecspresso deploy (server)
        run: ecspresso deploy --config infra/ecspresso/ecspresso.yml

      # Add release-<sha> to the image used in prod so the ECR lifecycle (keeps only the newest 30) does not remove it
      - name: Keep the prod image
        if: env.ENV == 'prod'
        run: |
          manifest=$(aws ecr batch-get-image --repository-name short-link-service/server --image-ids imageTag="$IMAGE_TAG" --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name short-link-service/server --image-tag "release-$IMAGE_TAG" --image-manifest "$manifest" >/dev/null 2>"$RUNNER_TEMP/put.err" \
            || grep -q ImageAlreadyExistsException "$RUNNER_TEMP/put.err" \
            || { cat "$RUNNER_TEMP/put.err"; exit 1; }

      - name: Deploy front (Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make deploy-front ENV="$ENV"

      # E2E against deployed environments (make e2e-remote) does not run in CI; run it locally.
      # GitHub runners come from data center IPs, so u-na-gi.com's Bot Fight Mode blocks them before Access
      # (403, cf-mitigated: challenge). Bot Fight Mode on the Free plan cannot have exceptions.
      # That the server is running is checked by ecspresso waiting for the service to stabilize, and by the task health check
