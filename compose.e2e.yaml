# E2E only. make e2e layers this over compose.yaml and starts it as a separate project (short-link-e2e).
# Even when run alongside the dev stack, ports, in-memory state, and build outputs do not mix.
#
# Requests go runn -> front (Vite) -> server (Play), testing the same path as a browser.
services:
  server:
    # Pass fixed values so the local .env does not change the results
    env_file: !reset []
    environment:
      SHORTENER_BASE_URL: https://example.com
    ports: !reset []

  front:
    ports: !reset []
    # If a request through Vite reaches Play's health check, both are able to respond.
    # Play's dev mode compiles on the first request, so the first run takes a few minutes
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://localhost:5173/api/v1/health'); process.exit(r.ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 3s

  runn:
    image: ghcr.io/k1low/runn:v1.11.0
    # Extra arguments (make e2e E2E_ARGS=--debug) are appended as command
    entrypoint: ["runn", "run", "/scenarios/*.yml", "--verbose", "--debug-on-failure"]
    environment:
      E2E_BASE_URL: http://front:5173
      # Self-reference is checked against the host of the server's SHORTENER_BASE_URL
      E2E_SELF_URL: https://example.com/abcd1234
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/tests/scenarios:/scenarios:ro
    depends_on:
      front:
        condition: service_healthy

# Share the dependency caches with the dev stack so they are not fetched again on every E2E run.
# Build outputs (server-target etc.) would be contended by a concurrently running sbt, so keep them per project
volumes:
  sbt-cache:
    name: short-link-service_sbt-cache
  coursier-cache:
    name: short-link-service_coursier-cache
