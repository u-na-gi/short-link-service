# E2E 専用。make e2e が compose.yaml に重ね、別プロジェクト (short-link-e2e) として起動する。
# 開発用と同時に動かしても、ポート・インメモリの状態・ビルド成果物が混ざらない。
#
# runn → front (Vite) → server (Play) の順に流し、ブラウザと同じ経路で検証する。
services:
  server:
    # 手元の .env で結果が変わらないよう、固定値を渡す
    env_file: !reset []
    environment:
      SHORTENER_BASE_URL: https://example.com
    ports: !reset []

  front:
    ports: !reset []
    # Vite 経由で Play のヘルスチェックまで届けば、両方が応答できる。
    # Play の dev モードは最初のリクエストでコンパイルするので、初回は数分かかる
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://localhost:5173/api/v1/health'); process.exit(r.ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 3s

  runn:
    image: ghcr.io/k1low/runn:v1.11.0
    # 追加の引数 (make e2e E2E_ARGS=--debug) は command として後ろに付く
    entrypoint: ["runn", "run", "/scenarios/*.yml", "--verbose", "--debug-on-failure"]
    environment:
      E2E_BASE_URL: http://front:5173
      # 自己参照の判定は server の SHORTENER_BASE_URL のホストと突き合わせる
      E2E_SELF_URL: https://example.com/abcd1234
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/tests/scenarios:/scenarios:ro
    depends_on:
      front:
        condition: service_healthy

# 依存のキャッシュは開発用と共有し、E2E のたびに取り直さないようにする。
# ビルド成果物 (server-target など) は同時に動く sbt と取り合うので、プロジェクトごとに分けたままにする
volumes:
  sbt-cache:
    name: short-link-service_sbt-cache
  coursier-cache:
    name: short-link-service_coursier-cache
