# ECS service and task definition. Resources created by Terraform are read from state via the tfstate plugin.
#
# The task runs on Fargate with 2 containers: server (Play) and cloudflared (Cloudflare Tunnel).
# Memory: of the task's 2048, server 1536 / cloudflared 256. Play's JVM uses 75% of the container limit as heap.
# cloudflared starts after the server health check (curl /api/v1/health) passes. If the Tunnel connects first,
# forwarding from the Worker fails until Play has started.
#
#   ENV=develop IMAGE_TAG=<ECR tag> ecspresso deploy --config ecspresso.yml
#
# ENV: develop / staging / prod. Determines the cluster name and the tfstate key.
# IMAGE_TAG: tag of short-link-service/server.
region: ap-northeast-1
cluster: short-link-{{ must_env `ENV` }}
service: server
service_definition: ecs-service-def.json
task_definition: ecs-task-def.json
timeout: "20m"
plugins:
  - name: tfstate
    config:
      url: s3://short-link-service-tfstate-0b102b6e/envs/{{ must_env `ENV` }}/terraform.tfstate
  # One ECR shared across environments (infra/terraform/shared)
  - name: tfstate
    func_prefix: shared_
    config:
      url: s3://short-link-service-tfstate-0b102b6e/shared/terraform.tfstate
