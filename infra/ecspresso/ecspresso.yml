# ECS の service とタスク定義。Terraform が作ったものは tfstate プラグインで state から読む。
#
# タスクは Fargate で、server (Play) と cloudflared (Cloudflare Tunnel) の 2 コンテナ。
# メモリはタスク 2048 のうち server 1536 / cloudflared 256。Play の JVM はコンテナの上限の 75% をヒープにする。
# cloudflared は server のヘルスチェック (curl で /api/v1/health) が通ってから起動する。先に Tunnel が繋がると、
# Play が起動するまでの間 Worker からの転送が失敗するため。
#
#   ENV=develop IMAGE_TAG=<ECR のタグ> ecspresso deploy --config ecspresso.yml
#
# ENV: develop / staging / prod。クラスタ名と tfstate の key を決める。
# IMAGE_TAG: short-link-service/server のタグ。
region: ap-northeast-1
cluster: short-link-{{ must_env `ENV` }}
service: server
service_definition: ecs-service-def.json
task_definition: ecs-task-def.json
timeout: "20m"
plugins:
  - name: tfstate
    config:
      url: s3://short-link-service-tfstate-0b102b6e/envs/{{ must_env `ENV` }}/terraform.tfstate
  # ECR は環境をまたいで 1 つ (infra/terraform/shared)
  - name: tfstate
    func_prefix: shared_
    config:
      url: s3://short-link-service-tfstate-0b102b6e/shared/terraform.tfstate
